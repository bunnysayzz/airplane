# CI — runs on every push to main and every PR targeting main.
# Gates (in order):
#   1. `npm run lint`      — ESLint must pass with zero warnings; catches style/unused-code drift early.
#   2. `npm run typecheck` — tsc --noEmit across all workspaces; a type error here blocks merge.
#   3. `npm run test:coverage` — Jest with coverage thresholds; a drop in
#      covered lines/branches fails the run so untested code can't merge silently.
# Node version is pinned by the repo's `.nvmrc` (Node 24) so CI matches local dev.
# `cache: 'npm'` on setup-node keeps `npm ci` fast across runs.
#
# --forceExit: some suites (mobile-services) leave async handles open after
# tests complete (pre-existing; tracked). Tests themselves pass; forceExit
# keeps CI from hanging on the 1s "did not exit" grace period.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Regression guard for the 2026-10-23 startup crash class
      # (`Cannot find native module 'ExpoLinking'` -> SIGABRT): every package
      # reachable from the app entry that ships an Android native module must
      # be listed by expo-modules-autolinking resolve (the exact source the
      # Gradle build uses). build-apk-no-eas.yml also runs this step plus a
      # fail-on-broken-input proof before the Gradle build.
      - name: Check startup-reachable native modules are autolinked
        run: node scripts/check-native-modules.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # A workflow file that doesn't parse fails the whole run at load time with
  # a cryptic error, so validate every workflow YAML parses as a gate.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all workflow YAML files parse
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml,glob; files=glob.glob('.github/workflows/*.yml'); [yaml.safe_load(open(f)) for f in files]; print(f'YAML OK: {len(files)} workflow files parsed')"
