name: Emulator smoke test

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Git ref to build and smoke-test (branch, tag, or SHA)'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out app ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0"

      # Same build as .github/workflows/build-apk-no-eas.yml: android/ is
      # committed (NovaMind route), plain Gradle — but x86_64-only here, to
      # match the Ubuntu/KVM emulator below (this workflow only; the shipped
      # APK workflow stays arm64-v8a).
      - name: Build release APK (x86_64 only)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Verify APK payload (no Sentry, allowlisted .so, embedded JS bundle)
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          echo "=== Full .so inventory of $APK ==="
          unzip -Z1 "$APK" | grep -E '^lib/[^/]+/[^/]+\.so$' | sort -u | tee /tmp/so-inventory.txt
          echo "=== End of inventory ==="

          # Hard fail: any Sentry native library, under any ABI/name variant.
          if grep -qi 'sentry' /tmp/so-inventory.txt; then
            echo "::error::Sentry native library found in APK:"
            grep -i 'sentry' /tmp/so-inventory.txt
            exit 1
          fi

          # Hard fail: any native library outside the known RN 0.79 / Expo SDK 53
          # families for this app's installed modules. Allowlist identical to
          # build-apk-no-eas.yml (completed from run 39649181234's inventory).
          UNEXPECTED=$(sed -E 's|^lib/[^/]+/||' /tmp/so-inventory.txt | sort -u | grep -vE '^(libc\+\+_shared\.so|libfbjni\.so|libfolly_runtime\.so|libglog\.so|libhermes\.so|libhermes_executor\.so|libimagepipeline\.so|libjsi\.so|liblogger\.so|libmapbufferjni\.so|libreactnative\.so|libreactnativejni\.so|libturbomodulejsijni\.so|libyoga\.so|libworklets\.so|libappmodules\.so|libexpo-modules-core\.so|libExpoModulesCore\.so|libfabricjni\.so|libuimanagerjni\.so|librrc_.*\.so|libreact_codegen_.*\.so|libgesturehandler\.so|libgifimage\.so|libhermestooling\.so|libnative-filters\.so|libnative-imagetranscoder\.so|libreanimated\.so|librnscreens\.so|libstatic-webp\.so)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected native libraries in APK:"
            echo "$UNEXPECTED"
            exit 1
          fi

          # Hard fail: the JS bundle must be embedded in the APK.
          echo "=== Assets in APK ==="
          unzip -Z1 "$APK" | grep '^assets/' | sort | tee /tmp/assets-inventory.txt || true
          if ! grep -qx 'assets/index.android.bundle' /tmp/assets-inventory.txt; then
            echo "::error::assets/index.android.bundle is MISSING from the APK - JS bundle not embedded."
            exit 1
          fi
          BUNDLE_SIZE=$(unzip -l "$APK" assets/index.android.bundle | awk 'NR==4 {print $1}')
          echo "JS bundle embedded OK: assets/index.android.bundle (${BUNDLE_SIZE} bytes)"

          echo "APK payload verification passed: no Sentry, all native libs allowlisted, JS bundle embedded."

      - name: Compute artifact-safe ref name
        run: echo "SAFE_REF=$(echo '${{ inputs.app_ref }}' | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')" >> "$GITHUB_ENV"

      # GitHub-hosted Ubuntu runners expose /dev/kvm but the runner user
      # needs access to it — the standard fix from the
      # reactivecircus/android-emulator-runner README.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # android-emulator-runner executes its `script:` input LINE BY LINE,
      # each line in a separate `sh -c` — shell variables do not survive
      # between lines (run 39985765647: APK=... was lost, so adb install
      # got an empty path and the step aborted). So the real script is
      # written to a file here and the action just runs that one file.
      # The smoke script always exits 0: whether the app lives or dies is
      # DATA (verdict.txt + logs + screenshot), not a job failure. Only
      # build/infra failures above fail this job.
      - name: Write smoke-test script
        run: |
          cat > smoke.sh <<'SMOKE_EOF'
          set +e
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          echo "Installing $APK"
          adb install -r "$APK"
          echo "adb install exit code: $?"
          adb logcat -c
          adb shell am start -W -n com.bunnysayzz.airplane/.MainActivity
          echo "am start exit code: $?"
          sleep 30
          PID=$(adb shell pidof com.bunnysayzz.airplane | tr -d '\r')
          if [ -n "$PID" ]; then
            echo "ALIVE pid=$PID" > verdict.txt
          else
            echo "DEAD (no process for com.bunnysayzz.airplane at 30s)" > verdict.txt
          fi
          echo "--- dumpsys activity processes excerpt for com.bunnysayzz.airplane ---" >> verdict.txt
          adb shell dumpsys activity processes | grep -i -B2 -A10 'com.bunnysayzz.airplane' >> verdict.txt
          adb exec-out screencap -p > screenshot.png
          adb logcat -b crash -d > crash.log
          adb logcat -d > logcat-full.log
          exit 0
          SMOKE_EOF
          chmod +x smoke.sh

      - name: Install, launch, and observe on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash smoke.sh

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-${{ env.SAFE_REF }}
          path: |
            verdict.txt
            screenshot.png
            crash.log
            logcat-full.log
          if-no-files-found: warn
