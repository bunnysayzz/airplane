# Auto-release — every push to main becomes a GitHub Release.
#
# PIPELINE (single job, serialized via concurrency):
#   1. Compute next version from the latest `v*` tag (starts at 0.0.1).
#   2. Bump `apps/mobile/app.json` expo.version, commit with [auto-release]
#      (the marker + the job-level `if` below stop infinite loops; CI still
#      runs on the bump commit so tests stay visible),
#      then push the commit and the new tag.
#   3. EAS cloud build of the `preview` profile (APK, sideloadable).
#      Requires the `EXPO_TOKEN` repo secret; fails fast if missing.
#   4. Download the APK and create the GitHub Release with generated notes.
#
# VERSIONING
#   Patch auto-increments: v0.0.1, v0.0.2, ... No manual tagging needed.
#   Minor/major bumps stay manual (push a tag like v0.1.0 yourself; the next
#   auto-release continues from there).
#
# COST NOTE
#   GitHub Actions is free/unlimited on public repos. EAS is not: the Expo
#   free plan allows ~30 builds/month, and every main push burns one.
#   If that quota becomes a problem, gate this workflow on release branches
#   or a manual dispatch instead.

name: Auto release

on:
  push:
    branches: [main]

concurrency:
  group: auto-release
  cancel-in-progress: false # queue releases; never run two version bumps at once

permissions:
  contents: write # push version-bump commit, tag, and create the Release

jobs:
  release:
    # Ignore the version-bump commits this workflow pushes itself.
    # (A custom marker - NOT [skip ci] - so CI/tests still run on the bump
    # commit and show up on the repo page.)
    if: "!contains(github.event.head_commit.message, '[auto-release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            ver="${latest#v}"
            major="${ver%%.*}"; rest="${ver#*.}"
            minor="${rest%%.*}"; patch="${rest##*.}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous tag: ${latest:-none})"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Require EXPO_TOKEN secret
        env:
          TOKEN_PRESENT: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "::error::EXPO_TOKEN repo secret is not set."
            echo "Add it once at https://github.com/bunnysayzz/airplane/settings/secrets/actions"
            exit 1
          fi

      - name: Bump app version, commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          node -e "
            const fs = require('fs');
            const p = 'apps/mobile/app.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.expo.version = process.env.APP_VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          " APP_VERSION="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app.json
          git commit -m "chore: bump version to $VERSION [auto-release]"
          git tag "$TAG"
          git push origin main "$TAG"

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS preview APK build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait --json > /tmp/build.json

      - name: Show EAS build error (on failure)
        if: failure()
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const b=require('/tmp/build.json'); const x=Array.isArray(b)?b[0]:b; console.log(x.id)")
          echo "Build ID: $BUILD_ID"
          curl -s -H "Authorization: Bearer $EXPO_TOKEN" \
            "https://api.expo.dev/v2/projects/98a17423-033b-4461-a779-82d919336f3c/builds/$BUILD_ID" \
          | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              try {
                const j=JSON.parse(d).data||JSON.parse(d);
                console.log('status:', j.status);
                console.log('error:', JSON.stringify(j.error||'none').slice(0,2000));
              } catch(e){ console.log('raw:', d.slice(0,1000)); }
            })"

      - name: Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(node -e "const b=require('/tmp/build.json'); const x=Array.isArray(b)?b[0]:b; console.log(x.artifacts.buildUrl)")
          curl -L --fail -o "airplane-${{ steps.version.outputs.tag }}.apk" "$URL"
          ls -la *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Airplane ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: "airplane-${{ steps.version.outputs.tag }}.apk"
