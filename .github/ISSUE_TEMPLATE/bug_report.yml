name: Bug report
description: Something broken? Tell us exactly what happened.
labels: [bug]
title: "[bug] "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug. What did you see vs. what did you expect?
      placeholder: The feed stopped updating after the phone locked...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can trigger it too.
      placeholder: |
        1. Start the app on two phones
        2. Move out of BLE range for 30s
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device(s) and OS
      description: e.g. Pixel 8 / Android 15, iPhone 13 / iOS 18.2. Include emulator details if used.
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The version in app.json / Settings → About (e.g. 0.1.0).
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logcat / Xcode console / metro output. Trim unrelated lines.
      render: text
      placeholder: |
        ```
        paste logs here
        ```
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability (security issues go through GitHub Security Advisories — see SECURITY.md)
          required: true
        - label: No secrets, tokens, keys, or credentials are included above
          required: true
